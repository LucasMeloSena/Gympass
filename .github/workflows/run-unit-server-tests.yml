name: Run Unit Server Tests

on: [pull_request]

jobs:
  run-unit-tests:
    name: Run Unit Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run test
